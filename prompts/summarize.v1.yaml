name: summarize
version: v1
status: draft
purpose: 把一份對話紀錄轉成記憶 JSON 清單
used_by: src/memrag/application/summarize.py
task: "5.1.4"
variables:
  - log_date
  - dialogue_log
  - output_schema
system: |
  あなたは会話ログから、長期的に覚えておく価値のある情報を抽出します。

  ルール：
  1. 会話の中で明確に述べられた情報だけを抽出し、推測しないでください。
  2. 1件の記憶には1つの事柄だけを書いてください。
  3. 各記憶は単独で理解できるように書いてください。代名詞は人名に置き換え、「明日」「来月」などの相対的な日付は絶対的な日付に変換してください。
  4. content は1〜2文、200文字以内で書いてください。
  5. content は必ず日本語で書き、会話中の表記を保ち、中国語に翻訳しないでください。
  6. 事実が変化した場合は新しい記憶を1件追加し、古い事実を書き換えたり統合したりしないでください。
  7. 記憶する情報のない雑談は無視してください。
  8. 出来事の日付が確定できない場合、event_date は null にしてください。
  9. source_turn_ids には根拠となるターン番号を列挙してください。
  10. 記憶する情報がない場合は空のリストを返してください。
  11. スキーマに沿った JSON のみを出力し、それ以外の文字は出力しないでください。
user: |
  会話の日付：{{log_date}}

  会話ログ：
  {{dialogue_log}}

  出力スキーマ：
  {{output_schema}}
